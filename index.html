    <!-- First-render critical path. The app boots by fetching data/eras.json to
         decide tiles-mode, then mounts the map. Preloading these in the document
         head starts them during HTML parse, in parallel with the JS bundle,
         instead of after main.ts executes. Era manifest is tiny and gates the
         whole map; the self-hosted Latin glyph ranges are needed for the very
         first labels. (Era/basemap PMTiles are range-requested by JS and cannot
         be usefully preloaded as whole files.) -->
    <link rel="preload" href="data/eras.json" as="fetch" type="application/json" crossorigin />
    <link rel="preload" href="fonts/Noto%20Sans%20Regular/0-255.pbf" as="fetch" type="application/x-protobuf" crossorigin />
